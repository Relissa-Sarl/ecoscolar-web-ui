name: CD Pipeline - EcoScolar frontend

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: GitHub Container Registry Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push of Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ecoscolar-frontend:latest
            ghcr.io/${{ github.repository_owner }}/ecoscolar-frontend:${{ github.sha }}

  deploy-to-server:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deployment on the server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # 1. Connect to the server and log in to GitHub Container Registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 2. Get last image from the registry
            docker pull ghcr.io/${{ github.repository_owner }}/ecoscolar-frontend:latest
            
            # 3. Stop and Remove the old container if it exists
            docker rm -f ecoscolar-frontend || true
            
            # 4. Run the new container with the latest image, mapping port 3000 to 80
            docker run -d --name ecoscolar-frontend -p 3000:80 ghcr.io/${{ github.repository_owner }}/ecoscolar-frontend:latest