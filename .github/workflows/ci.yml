name: ci pipeline - frontend

on: push

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --shamefully-hoist --ignore-workspace

      - name: Nuxt Type Preparation
        run: pnpm nuxi prepare

      - name: Lint
        run: pnpm run lint
      
      - name: Nuxt Build
        run: pnpm build

      - name: Docker Build Test
        run: docker build -t ms-frontend-proj .
