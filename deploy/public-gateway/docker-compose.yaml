services:
  ecoscolar-gateway:
    image: nginx:alpine
    container_name: ecoscolar-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-3100}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ecoscolar-frontend
      - ecoscolar-backend
      - ecoscolar-mailpit
    networks:
      - ecoscolar

  ecoscolar-frontend:
    image: ghcr.io/relissa-sarl/ecoscolar-frontend:${FRONTEND_IMAGE_TAG:-latest}
    container_name: ecoscolar-frontend
    restart: unless-stopped
    networks:
      - ecoscolar

  ecoscolar-backend:
    image: ghcr.io/relissa-sarl/ecoscolar-web-api:${BACKEND_IMAGE_TAG:-latest}
    container_name: ecoscolar-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ApplyDatabaseMigrations: "${APPLY_DATABASE_MIGRATIONS:-true}"
      ConnectionStrings__Default: "${ECOSCOLAR_SQL_CONNECTION_STRING}"
      Stripe__SecretKey: "${STRIPE_SECRET_KEY}"
      Smtp__Host: ecoscolar-mailpit
      Smtp__Port: "1025"
    depends_on:
      - ecoscolar-mailpit
    networks:
      - ecoscolar

  ecoscolar-mailpit:
    image: axllent/mailpit:latest
    container_name: ecoscolar-mailpit
    restart: unless-stopped
    environment:
      MP_WEBROOT: /mailpit/
    networks:
      - ecoscolar

networks:
  ecoscolar:
    driver: bridge
